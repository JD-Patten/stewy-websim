<title>Stewy Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* jdrobotics site palette: off-white, dark blue, lime, light blue, magenta. One light theme, to match the site. */
  :root {
    --off-white: #f6f9f5;
    --dark-blue: #035772;
    --lime: #e0fd2c;
    --light-blue: #a5c8d4;
    --magenta: #a12767;
    --ground: var(--off-white);
    --panel: var(--off-white);
    --panel-edge: var(--light-blue);
    --ink: var(--dark-blue);
    --ink-soft: #3e7385;
    --accent: var(--magenta);
    --accent-ink: #ffffff;
    --active: var(--magenta);
    --active-ink: #ffffff;
    --telemetry: var(--dark-blue);
    --track: color-mix(in srgb, var(--light-blue) 55%, var(--off-white));
    --scene: var(--off-white);
    --floor: var(--dark-blue);
    --grid-major: var(--off-white);
    --grid-minor: rgba(246, 249, 245, 0.35);
    --trail: var(--lime);
    --arrow: var(--light-blue);
    --good: #2e8b57;
    --warn: var(--magenta);
    --radius: 10px;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 14px/1.45 var(--body);
  }
  .app {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 0;
  }
  .stage { position: relative; min-height: 0; background: var(--scene); }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    text-align: center; color: var(--ink-soft); pointer-events: none;
  }
  .overlay p { max-width: 42ch; margin: 0; }
  .overlay.error { color: var(--warn); pointer-events: auto; }
  .hud {
    position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;
    pointer-events: none;
  }
  .chip {
    font: 500 12px/1 var(--mono); padding: 6px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--panel-edge);
    color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--ink); font-weight: 500; }
  .rail {
    background: var(--panel); border-left: 1px solid var(--panel-edge);
    padding-block: 18px; padding-inline: 18px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .brand h1 {
    font: 600 26px/1 var(--display); letter-spacing: 0.02em; margin: 0; text-transform: uppercase;
  }
  .brand h1 span { color: var(--accent); }
  .brand small { color: var(--ink-soft); font: 400 11px/1.3 var(--mono); text-align: right; }
  .lede { margin: 0; color: var(--ink-soft); max-width: 60ch; text-wrap: pretty; }
  .label {
    font: 600 11px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft);
    margin: 0 0 8px;
  }
  .pad-wrap { display: grid; justify-items: center; gap: 8px; }
  #pad { width: 280px; height: 280px; max-width: 100%; }
  #pad .dir { cursor: pointer; }
  #pad .dir path { fill: var(--track); stroke: var(--panel-edge); stroke-width: 1; transition: fill .15s; }
  #pad .dir:hover path, #pad .dir:focus-visible path { fill: color-mix(in srgb, var(--accent) 30%, var(--track)); }
  #pad .dir.on path { fill: var(--active); stroke: var(--dark-blue); }
  #pad .dir text { font: 600 11px var(--mono); fill: var(--ink-soft); pointer-events: none; }
  #pad .dir.on text { fill: var(--active-ink); }
  #pad .dir:focus-visible { outline: none; }
  #pad .dir:focus-visible path { stroke: var(--ink); stroke-width: 2; }
  #pad { touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  #pad .art * { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
  #pad .art .in { stroke: var(--panel-edge); stroke-width: 1.2; }
  #pad .tick { fill: var(--panel-edge); }
  #pad .knob { cursor: grab; }
  #pad .knob circle { fill: var(--ink); stroke: var(--ink); stroke-width: 2; transition: fill .15s; }
  #pad .knob .ring { fill: none; stroke: var(--panel); stroke-opacity: .35; stroke-width: 1.2; }
  #pad .knob .dot { fill: var(--panel); stroke: none; }
  #pad .knob.on circle:first-child { fill: var(--active); stroke: var(--dark-blue); }
  #pad .knob:focus-visible { outline: none; }
  #pad .knob:focus-visible circle:first-child { stroke: var(--lime); stroke-width: 4; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.act {
    flex: 1 1 0; min-width: 0; font: 600 13px/1 var(--body); padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--panel-edge); background: var(--ground); color: var(--ink); cursor: pointer;
  }
  button.act:hover { border-color: var(--ink-soft); }
  button.act.on { background: var(--active); border-color: var(--dark-blue); color: var(--active-ink); }
  button.act:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .readout {
    border: 1px solid var(--panel-edge); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px;
  }
  .readout .v { font: 500 22px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
  .readout .u { font: 400 11px/1 var(--mono); color: var(--ink-soft); }
  .servos { display: grid; gap: 6px; }
  .servo { display: grid; grid-template-columns: 22px minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
  .servo .n { font: 500 11px var(--mono); color: var(--ink-soft); }
  .servo .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .servo .bar i { display: block; height: 100%; width: 0; background: var(--telemetry); }
  .servo .bar i.hot { background: var(--magenta); }
  .servo .a { font: 400 11px var(--mono); color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
  .keys { color: var(--ink-soft); font-size: 12px; margin: 0; }
  kbd {
    font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--panel-edge); border-bottom-width: 2px;
    border-radius: 4px; background: var(--ground); color: var(--ink);
  }
  .opts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
  .opts select {
    font: 500 12px var(--body); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--panel-edge);
    background: var(--ground); color: var(--ink);
  }
  .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); }
  .chk input { margin: 0; accent-color: var(--accent); width: 15px; height: 15px; }
  .chk input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .terrain { display: grid; gap: 12px; }
  .lvl { display: grid; gap: 4px; }
  .lvl-name { font: 600 12px/1.2 var(--body); color: var(--ink); }
  .sl { display: grid; grid-template-columns: 44px minmax(0, 1fr) 48px; gap: 8px; align-items: center;
    font-size: 12px; color: var(--ink-soft); }
  .sl input { width: 100%; margin: 0; accent-color: var(--accent); }
  .sl input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sl output { font: 400 11px var(--mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 55%) auto; }
    .rail { border-left: 0; border-top: 1px solid var(--panel-edge); padding-inline: 16px; }
    #pad { width: 260px; height: 260px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="stage" id="stage">
    <div class="overlay" id="overlay"><p id="overlay-text">Loading the physics engine…</p></div>
    <div class="hud" aria-live="polite">
      <span class="chip">sim <b id="hud-time">0.0 s</b></span>
      <span class="chip">doing <b id="hud-policy">stand</b></span>
      <span class="chip">rate <b id="hud-rate">1×</b></span>
    </div>
  </div>

  <aside class="rail">
    <section>
      <div class="pad-wrap">
        <svg id="pad" viewBox="-140 -140 280 280" role="group" aria-label="Walking joystick and turn buttons"></svg>
      </div>
    </section>

    <div class="row">
      <button class="act" id="btn-stop" type="button">Stand</button>
      <button class="act" id="btn-reset" type="button">Reset robot</button>
    </div>

    
    
    
    <div class="opts">
      <label class="chk"><input type="checkbox" id="chk-head" checked> Head</label>
      <label for="sel-rate">Speed</label>
      <select id="sel-rate">
        <option value="1">Real time</option>
        <option value="0.5">Half speed</option>
        <option value="0.25">Quarter speed</option>
      </select>
      <label for="sel-cam">Camera</label>
      <select id="sel-cam">
        <option value="follow">Follow</option>
        <option value="free">Free</option>
      </select>
    </div>

    <p class="keys">Arrows or <kbd>W</kbd> <kbd>Q</kbd> <kbd>E</kbd> walk (12 directions) ·
      <kbd>A</kbd> <kbd>D</kbd> turn · <kbd>S</kbd> stand · <kbd>R</kbd> reset</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="app.js"></script>
